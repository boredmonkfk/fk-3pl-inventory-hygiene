<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FK Minutes · 3PL Charter Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0B1523;color:#e2e8f0;font-family:'DM Sans',sans-serif}
    button{font-family:inherit;cursor:pointer}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0B1523}
    ::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {createElement:h,useState,useMemo,Fragment}=React;
 
const STORES=[
  {id:"pun_114_wh_hl_01",name:"Hinjewadi Phase 3",city:"Pune",orders:661,inf_pct:0.6,cold_wp_pct:1.55,bin_acc:40.0,pst_15d:11,hv_pst:97,auto_ttl:47,expired_inv_pct:13.31,dmmq_pct:1.6,final_score:2.5,bin_acc_score:1.6,hv_pst_score:4.7,pst_score:0.1,auto_ttl_score:2.9,cold_wp_score:1.9,inf_score:3.8,expired_score:0.0,dmmq_score:1.4,ptpi_score:3.4},
  {id:"pun_140_wh_hl_01",name:"Pimple Gurav",city:"Pune",orders:368,inf_pct:0.5,cold_wp_pct:3.72,bin_acc:86.18,pst_15d:45,hv_pst:86,auto_ttl:50,expired_inv_pct:8.15,dmmq_pct:1.9,final_score:3.2,bin_acc_score:3.7,hv_pst_score:3.7,pst_score:1.8,auto_ttl_score:3.0,cold_wp_score:0.0,inf_score:4.0,expired_score:0.0,dmmq_score:1.1,ptpi_score:4.8},
  {id:"pun_144_wh_hl_01",name:"Marynji",city:"Pune",orders:556,inf_pct:0.2,cold_wp_pct:4.27,bin_acc:99.48,pst_15d:22,hv_pst:99,auto_ttl:86,expired_inv_pct:1.98,dmmq_pct:1.0,final_score:3.8,bin_acc_score:4.9,hv_pst_score:4.9,pst_score:0.8,auto_ttl_score:4.4,cold_wp_score:0.0,inf_score:4.6,expired_score:1.0,dmmq_score:2.1,ptpi_score:4.8},
  {id:"pun_159_wh_hl_01",name:"Chikhali",city:"Pune",orders:242,inf_pct:0.0,cold_wp_pct:4.43,bin_acc:96.2,pst_15d:10,hv_pst:0,auto_ttl:63,expired_inv_pct:31.82,dmmq_pct:1.3,final_score:3.3,bin_acc_score:4.6,hv_pst_score:0.0,pst_score:0.0,auto_ttl_score:3.5,cold_wp_score:0.0,inf_score:5.0,expired_score:0.0,dmmq_score:1.7,ptpi_score:4.5},
  {id:"kol_103_wh_hl_01",name:"Kamalgazi",city:"Kolkata",orders:488,inf_pct:1.8,cold_wp_pct:5.29,bin_acc:62.5,pst_15d:25,hv_pst:0,auto_ttl:66,expired_inv_pct:0.82,dmmq_pct:0.5,final_score:2.6,bin_acc_score:2.5,hv_pst_score:0.0,pst_score:1.0,auto_ttl_score:3.6,cold_wp_score:0.0,inf_score:1.7,expired_score:2.4,dmmq_score:3.0,ptpi_score:4.6},
  {id:"ben_229_wh_hl_01",name:"Dommasandra",city:"Bengaluru",orders:238,inf_pct:0.7,cold_wp_pct:2.49,bin_acc:99.49,pst_15d:30,hv_pst:39,auto_ttl:90,expired_inv_pct:1.68,dmmq_pct:1.0,final_score:3.4,bin_acc_score:4.9,hv_pst_score:1.5,pst_score:1.2,auto_ttl_score:4.6,cold_wp_score:0.7,inf_score:3.6,expired_score:1.3,dmmq_score:2.0,ptpi_score:4.1},
  {id:"hyd_165_wh_hl_01",name:"Neredmet Road",city:"Hyderabad",orders:236,inf_pct:0.0,cold_wp_pct:4.21,bin_acc:100.0,pst_15d:51,hv_pst:98,auto_ttl:29,expired_inv_pct:3.39,dmmq_pct:0.8,final_score:3.9,bin_acc_score:5.0,hv_pst_score:4.8,pst_score:2.1,auto_ttl_score:2.2,cold_wp_score:0.0,inf_score:5.0,expired_score:0.0,dmmq_score:2.4,ptpi_score:5.0},
  {id:"hyd_134_wh_hl_01",name:"Shastripuram",city:"Hyderabad",orders:223,inf_pct:1.3,cold_wp_pct:14.35,bin_acc:5.26,pst_15d:62,hv_pst:64,auto_ttl:36,expired_inv_pct:4.93,dmmq_pct:0.7,final_score:2.0,bin_acc_score:0.2,hv_pst_score:2.6,pst_score:2.5,auto_ttl_score:2.4,cold_wp_score:0.0,inf_score:2.4,expired_score:0.0,dmmq_score:2.6,ptpi_score:3.2},
  {id:"koz_105_wh_hl_01",name:"Puthiyara",city:"Kozhikode",orders:215,inf_pct:0.0,cold_wp_pct:0.0,bin_acc:98.45,pst_15d:62,hv_pst:24,auto_ttl:100,expired_inv_pct:0.0,dmmq_pct:0.4,final_score:4.0,bin_acc_score:4.8,hv_pst_score:0.9,pst_score:2.5,auto_ttl_score:5.0,cold_wp_score:5.0,inf_score:5.0,expired_score:5.0,dmmq_score:3.6,ptpi_score:3.0},
  {id:"rok_102_wh_hl_01",name:"Elayavoor",city:"Rest of Kerala",orders:231,inf_pct:0.0,cold_wp_pct:0.0,bin_acc:99.64,pst_15d:70,hv_pst:16,auto_ttl:100,expired_inv_pct:0.0,dmmq_pct:0.5,final_score:4.1,bin_acc_score:5.0,hv_pst_score:0.4,pst_score:2.8,auto_ttl_score:5.0,cold_wp_score:5.0,inf_score:5.0,expired_score:5.0,dmmq_score:3.0,ptpi_score:3.8},
];
 
const MISSING=[
  {id:"hyd_164_wh_hl_01",city:"Hyderabad"},
  {id:"hyd_130_wh_hl_01",city:"Hyderabad"},
  {id:"koz_103_wh_hl_01",city:"Kozhikode"},
  {id:"kol_133_wh_hl_01",city:"Kolkata"},
  {id:"tri_104_wh_hl_01",city:"Trichy"},
];
 
const METRIC_DEFS=[
  {metric:"Bin Accuracy",       formula:"Zero net-variance locations / Total locations audited",          wq:"25.0%",wp:"20%",  key:"bin_acc_score",  up:true},
  {metric:"PST 7D (HV)",        formula:"HV locations touched last 7 days / Total HV locations",          wq:"5.0%", wp:"5.0%", key:"hv_pst_score",   up:true},
  {metric:"PST 15D (All)",      formula:"Locations touched last 15 days / Total locations",               wq:"5.0%", wp:"5.0%", key:"pst_score",      up:true},
  {metric:"Expired Inventory",  formula:"Units of expired inventory / Total orders that day",             wq:"5.0%", wp:"5.0%", key:"expired_score",  up:false},
  {metric:"Auto TTL Adherence", formula:"Auto TTLs closed within 4 hrs / Total auto TTLs generated",     wq:"5.0%", wp:"5.0%", key:"auto_ttl_score", up:true},
  {metric:"INF %",              formula:"Orders INF marked / Total orders",                               wq:"17.5%",wp:"20.0%",key:"inf_score",      up:false},
  {metric:"COLD Wrong Placement",formula:"Cold FSN units in wrong location / Total Cold ATP",             wq:"2.5%", wp:"5.0%", key:"cold_wp_score",  up:false},
  {metric:"Locations / Lot",    formula:"Average number of locations per WID",                            wq:"5.0%", wp:"5.0%", key:null,             up:false},
  {metric:"DMMQ",               formula:"Damaged + Misshipment + Missing + Quality complaints / Picked", wq:"10.0%",wp:"10.0%",key:"dmmq_score",     up:false},
  {metric:"PTPI (seconds)",     formula:"Total pick time in seconds / Number of units picked",            wq:"20.0%",wp:"20.0%",key:"ptpi_score",     up:false},
];
 
const SCORE_COLS=[
  {key:"bin_acc_score",label:"Bin Accuracy",wq:"25.0%"},
  {key:"hv_pst_score",label:"HV PST",wq:"5.0%"},
  {key:"pst_score",label:"Overall PST",wq:"5.0%"},
  {key:"auto_ttl_score",label:"Auto TTL",wq:"5.0%"},
  {key:"cold_wp_score",label:"Cold Plcmt",wq:"2.5%"},
  {key:"inf_score",label:"INF",wq:"17.5%"},
  {key:"expired_score",label:"Expiry",wq:"5.0%"},
  {key:"dmmq_score",label:"DMMQ",wq:"10.0%"},
  {key:"ptpi_score",label:"PTPI",wq:"20.0%"},
];
 
const TABS=["Overview","Scores","Operations","Quality","Definitions"];
 
const sColor=s=>s>=4?"#22c55e":s>=3?"#f59e0b":"#ef4444";
const sBg=s=>s>=4?"rgba(34,197,94,0.12)":s>=3?"rgba(245,158,11,0.12)":"rgba(239,68,68,0.12)";
const pColor=(v,good,warn,inv)=>inv?(v>=good?"#22c55e":v>=warn?"#f59e0b":"#ef4444"):(v<=good?"#22c55e":v<=warn?"#f59e0b":"#ef4444");
const label=id=>id.split("_wh_hl_01")[0].toUpperCase();
 
function MiniBar({value,max=5,color}){
  return h("div",{style:{display:"flex",alignItems:"center",gap:6}},
    h("div",{style:{flex:1,height:5,background:"rgba(255,255,255,0.08)",borderRadius:3,overflow:"hidden"}},
      h("div",{style:{width:`${(value/max)*100}%`,height:"100%",background:color,borderRadius:3}})
    ),
    h("span",{style:{fontSize:11,color,minWidth:24,textAlign:"right"}},value)
  );
}
 
function ScoreRing({score}){
  const r=22,cx=28,cy=28,circ=2*Math.PI*r,fill=(score/5)*circ,color=sColor(score);
  return h("svg",{width:56,height:56},
    h("circle",{cx,cy,r,fill:"none",stroke:"rgba(255,255,255,0.08)",strokeWidth:5}),
    h("circle",{cx,cy,r,fill:"none",stroke:color,strokeWidth:5,
      strokeDasharray:`${fill} ${circ}`,strokeLinecap:"round",
      transform:`rotate(-90 ${cx} ${cy})`}),
    h("text",{x:cx,y:cy+5,textAnchor:"middle",fill:color,fontSize:13,fontWeight:700,
      fontFamily:"IBM Plex Mono,monospace"},score.toFixed(1))
  );
}
 
function Th({col,sk,sd,onSort,children}){
  const active=sk===col;
  return h("th",{
    onClick:()=>onSort(col),
    style:{padding:"10px 12px",textAlign:"left",cursor:"pointer",userSelect:"none",
      color:active?"#FFD200":"#64748b",fontWeight:600,fontSize:10,letterSpacing:.5,
      textTransform:"uppercase",whiteSpace:"nowrap",borderBottom:"1px solid rgba(255,255,255,0.08)"}
  },children,active?h("span",{style:{marginLeft:4}},sd==="desc"?"↓":"↑"):null);
}
 
function App(){
  const [tab,setTab]=useState("Overview");
  const [sk,setSk]=useState("final_score");
  const [sd,setSd]=useState("desc");
  const [sel,setSel]=useState(null);
 
  const sorted=useMemo(()=>[...STORES].sort((a,b)=>{
    const va=a[sk]??0,vb=b[sk]??0;
    return sd==="desc"?vb-va:va-vb;
  }),[sk,sd]);
 
  const stats=useMemo(()=>({
    totalOrders:STORES.reduce((s,d)=>s+d.orders,0),
    avgScore:(STORES.reduce((s,d)=>s+d.final_score,0)/STORES.length).toFixed(2),
    avgInf:(STORES.reduce((s,d)=>s+d.inf_pct,0)/STORES.length).toFixed(2),
    avgBinAcc:(STORES.reduce((s,d)=>s+d.bin_acc,0)/STORES.length).toFixed(1),
  }),[]);
 
  const sort=key=>{
    if(sk===key)setSd(d=>d==="desc"?"asc":"desc");
    else{setSk(key);setSd("desc");}
  };
 
  // ── styles shorthand
  const mono={fontFamily:"IBM Plex Mono,monospace"};
  const trStyle=i=>({background:i%2===0?"rgba(255,255,255,0.015)":"transparent",borderBottom:"1px solid rgba(255,255,255,0.04)"});
 
  return h("div",{style:{fontFamily:"'DM Sans',sans-serif",background:"#0B1523",minHeight:"100vh",color:"#e2e8f0",paddingBottom:40}},
 
    // HEADER
    h("div",{style:{background:"linear-gradient(135deg,#0F2236,#0B1523)",borderBottom:"1px solid rgba(255,210,0,0.15)",padding:"18px 28px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:14}},
        h("div",{style:{background:"#FFD200",borderRadius:8,padding:"6px 12px",fontWeight:800,fontSize:13,color:"#0B1523",letterSpacing:.5,...mono}},"FK"),
        h("div",null,
          h("div",{style:{fontSize:16,fontWeight:700,letterSpacing:.3}},"3PL Charter Dashboard"),
          h("div",{style:{fontSize:11,color:"#64748b",marginTop:1}},"Inventory Hygiene · 19 May 2025 · "+STORES.length+" Live / 15 Charter Stores")
        )
      ),
      h("div",{style:{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:6,padding:"5px 10px",fontSize:11,color:"#f87171"}},
        "⚠ "+MISSING.length+" stores not in sheet yet"
      )
    ),
 
    // KPI STRIP
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:1,background:"rgba(255,255,255,0.04)",borderBottom:"1px solid rgba(255,255,255,0.06)"}},
      ...[
        {l:"Charter Total Orders",v:stats.totalOrders.toLocaleString(),a:"#FFD200"},
        {l:"Avg Final Score",v:stats.avgScore+" / 5",a:sColor(parseFloat(stats.avgScore))},
        {l:"Avg INF %",v:stats.avgInf+"%",a:parseFloat(stats.avgInf)<=1?"#22c55e":"#f59e0b"},
        {l:"Avg Bin Accuracy",v:stats.avgBinAcc+"%",a:parseFloat(stats.avgBinAcc)>=80?"#22c55e":"#f59e0b"},
      ].map((k,i)=>h("div",{key:i,style:{padding:"14px 20px",background:"#0F1E30"}},
        h("div",{style:{fontSize:10,color:"#64748b",letterSpacing:.8,textTransform:"uppercase",marginBottom:4}},k.l),
        h("div",{style:{fontSize:22,fontWeight:700,color:k.a,...mono}},k.v)
      ))
    ),
 
    // TABS
    h("div",{style:{display:"flex",padding:"0 28px",borderBottom:"1px solid rgba(255,255,255,0.06)"}},
      ...TABS.map(t=>h("button",{key:t,onClick:()=>setTab(t),style:{
        background:"none",border:"none",padding:"12px 18px",fontSize:13,
        fontWeight:tab===t?600:400,color:tab===t?"#FFD200":"#64748b",
        borderBottom:`2px solid ${tab===t?"#FFD200":"transparent"}`,transition:"all 0.2s"
      }},t))
    ),
 
    // CONTENT
    h("div",{style:{padding:"20px 28px"}},
 
      // ── OVERVIEW
      tab==="Overview"&&h("div",null,
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}},
          ...sorted.map(s=>h("div",{key:s.id,onClick:()=>setSel(sel===s.id?null:s.id),style:{
              background:sel===s.id?"rgba(255,210,0,0.06)":"#0F1E30",
              border:`1px solid ${sel===s.id?"rgba(255,210,0,0.3)":"rgba(255,255,255,0.06)"}`,
              borderRadius:10,padding:16,cursor:"pointer",transition:"all 0.2s"
            }},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}},
              h("div",null,
                h("div",{style:{fontWeight:600,fontSize:13}},s.name),
                h("div",{style:{fontSize:10,color:"#64748b",marginTop:2,...mono}},label(s.id)+" · "+s.city)
              ),
              h(ScoreRing,{score:s.final_score})
            ),
            h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 12px",fontSize:11}},
              h("div",{style:{color:"#94a3b8"}},"Orders ",h("span",{style:{color:"#e2e8f0",fontWeight:600}},s.orders)),
              h("div",{style:{color:"#94a3b8"}},"INF% ",h("span",{style:{color:pColor(s.inf_pct,1,2.5,false),fontWeight:600}},s.inf_pct+"%")),
              h("div",{style:{color:"#94a3b8"}},"Bin Acc ",h("span",{style:{color:pColor(s.bin_acc,80,60,true),fontWeight:600}},s.bin_acc+"%")),
              h("div",{style:{color:"#94a3b8"}},"AutoTTL ",h("span",{style:{color:pColor(s.auto_ttl,80,60,true),fontWeight:600}},s.auto_ttl+"%"))
            ),
            sel===s.id&&h("div",{style:{marginTop:14,borderTop:"1px solid rgba(255,255,255,0.08)",paddingTop:12}},
              h("div",{style:{fontSize:10,color:"#64748b",marginBottom:8,letterSpacing:.6,textTransform:"uppercase"}},"Score Breakdown"),
              ...SCORE_COLS.map(c=>h("div",{key:c.key,style:{marginBottom:5}},
                h("div",{style:{fontSize:10,color:"#94a3b8",marginBottom:2}},c.label),
                h(MiniBar,{value:s[c.key],max:5,color:sColor(s[c.key])})
              ))
            )
          )),
          ...MISSING.map(s=>h("div",{key:s.id,style:{background:"rgba(239,68,68,0.04)",border:"1px dashed rgba(239,68,68,0.2)",borderRadius:10,padding:16,opacity:.6}},
            h("div",{style:{fontWeight:600,fontSize:13,color:"#f87171"}},label(s.id)),
            h("div",{style:{fontSize:10,color:"#64748b",marginTop:2,...mono}},label(s.id)+" · "+s.city),
            h("div",{style:{marginTop:12,fontSize:11,color:"#f87171"}},"Not in sheet — awaiting data")
          ))
        )
      ),
 
      // ── SCORES
      tab==="Scores"&&h("div",null,
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}},
          ...METRIC_DEFS.filter(d=>d.key).map(d=>h("div",{key:d.metric,title:d.formula+" | Weight: "+d.wq,
            style:{background:"#0F1E30",border:"1px solid rgba(255,255,255,0.08)",borderRadius:5,padding:"4px 9px",fontSize:10,color:"#94a3b8"}},
            h("span",{style:{color:"#FFD200",fontWeight:600}},d.wq)," ",d.metric
          ))
        ),
        h("div",{style:{overflowX:"auto"}},
          h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
            h("thead",null,h("tr",{style:{background:"#0F1E30"}},
              h(Th,{col:"name",sk,sd,onSort:sort},"Store"),
              h(Th,{col:"final_score",sk,sd,onSort:sort},"Final Score"),
              ...SCORE_COLS.map(c=>h(Th,{key:c.key,col:c.key,sk,sd,onSort:sort},
                h("span",null,c.label),
                h("span",{style:{display:"block",color:"rgba(255,210,0,0.5)",fontWeight:400,fontSize:9,marginTop:1}},c.wq)
              ))
            )),
            h("tbody",null,...sorted.map((s,i)=>h("tr",{key:s.id,style:trStyle(i)},
              h("td",{style:{padding:"10px 12px",whiteSpace:"nowrap"}},
                h("div",{style:{fontWeight:600}},s.name),
                h("div",{style:{fontSize:10,color:"#64748b",...mono}},label(s.id)+" · "+s.city)
              ),
              h("td",{style:{padding:"10px 12px"}},
                h("span",{style:{background:sBg(s.final_score),color:sColor(s.final_score),padding:"3px 9px",borderRadius:5,fontWeight:700,...mono,fontSize:13}},s.final_score)
              ),
              ...SCORE_COLS.map(c=>h("td",{key:c.key,style:{padding:"10px 12px"}},
                h("span",{style:{color:sColor(s[c.key]),fontWeight:600,...mono}},s[c.key])
              ))
            )))
          )
        )
      ),
 
      // ── OPERATIONS
      tab==="Operations"&&h("div",{style:{overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
          h("thead",null,h("tr",{style:{background:"#0F1E30"}},
            ...[{k:"name",l:"Store"},{k:"orders",l:"Total Orders"},{k:"auto_ttl",l:"Auto TTL %"},{k:"pst_15d",l:"PST 15D %"},{k:"hv_pst",l:"HV PST %"},{k:"bin_acc",l:"Bin Accuracy %"}]
            .map(c=>h(Th,{key:c.k,col:c.k,sk,sd,onSort:sort},c.l))
          )),
          h("tbody",null,...sorted.map((s,i)=>h("tr",{key:s.id,style:trStyle(i)},
            h("td",{style:{padding:"10px 12px"}},h("div",{style:{fontWeight:600}},s.name),h("div",{style:{fontSize:10,color:"#64748b",...mono}},s.city)),
            h("td",{style:{padding:"10px 12px",fontWeight:600,...mono,color:"#e2e8f0"}},s.orders),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.auto_ttl,80,60,true),fontWeight:600,...mono}},s.auto_ttl+"%")),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.pst_15d,60,40,true),fontWeight:600,...mono}},s.pst_15d+"%")),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.hv_pst,80,50,true),fontWeight:600,...mono}},s.hv_pst+"%")),
            h("td",{style:{padding:"10px 12px"}},
              h("div",{style:{display:"flex",alignItems:"center",gap:8}},
                h("div",{style:{width:80,height:5,background:"rgba(255,255,255,0.08)",borderRadius:3,overflow:"hidden"}},
                  h("div",{style:{width:`${s.bin_acc}%`,height:"100%",background:pColor(s.bin_acc,80,60,true),borderRadius:3}})
                ),
                h("span",{style:{color:pColor(s.bin_acc,80,60,true),fontWeight:600,...mono,fontSize:11}},s.bin_acc+"%")
              )
            )
          )))
        )
      ),
 
      // ── QUALITY
      tab==="Quality"&&h("div",{style:{overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
          h("thead",null,h("tr",{style:{background:"#0F1E30"}},
            ...[{k:"name",l:"Store"},{k:"inf_pct",l:"INF %"},{k:"cold_wp_pct",l:"Cold Wrong Plcmt %"},{k:"expired_inv_pct",l:"Expired Inv %"},{k:"dmmq_pct",l:"DMMQ %"},{k:"final_score",l:"Final Score"}]
            .map(c=>h(Th,{key:c.k,col:c.k,sk,sd,onSort:sort},c.l))
          )),
          h("tbody",null,...sorted.map((s,i)=>h("tr",{key:s.id,style:trStyle(i)},
            h("td",{style:{padding:"10px 12px"}},h("div",{style:{fontWeight:600}},s.name),h("div",{style:{fontSize:10,color:"#64748b",...mono}},s.city)),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.inf_pct,1,2.5,false),fontWeight:600,...mono}},s.inf_pct+"%")),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.cold_wp_pct,2,5,false),fontWeight:600,...mono}},s.cold_wp_pct+"%")),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.expired_inv_pct,5,15,false),fontWeight:600,...mono}},s.expired_inv_pct+"%")),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{color:pColor(s.dmmq_pct,1,2,false),fontWeight:600,...mono}},s.dmmq_pct+"%")),
            h("td",{style:{padding:"10px 12px"}},h("span",{style:{background:sBg(s.final_score),color:sColor(s.final_score),padding:"3px 9px",borderRadius:5,fontWeight:700,...mono,fontSize:13}},s.final_score))
          )))
        )
      ),
 
      // ── DEFINITIONS
      tab==="Definitions"&&h("div",null,
        h("p",{style:{marginBottom:16,fontSize:12,color:"#64748b"}},"Score weights for Quarterly (Q) and Periodic (P) review."),
        h("div",{style:{overflowX:"auto"}},
          h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
            h("thead",null,h("tr",{style:{background:"#0F1E30"}},
              ...["Metric","Formula / Definition","Weight (Q)","Weight (P)","Direction"].map(hd=>
                h("th",{key:hd,style:{padding:"10px 14px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:10,letterSpacing:.5,textTransform:"uppercase",whiteSpace:"nowrap",borderBottom:"1px solid rgba(255,255,255,0.08)"}},hd)
              )
            )),
            h("tbody",null,
              ...METRIC_DEFS.map((d,i)=>h("tr",{key:d.metric,style:trStyle(i)},
                h("td",{style:{padding:"12px 14px",fontWeight:600,whiteSpace:"nowrap",color:"#e2e8f0"}},d.metric),
                h("td",{style:{padding:"12px 14px",color:"#94a3b8",lineHeight:1.6}},d.formula),
                h("td",{style:{padding:"12px 14px",fontWeight:700,color:"#FFD200",whiteSpace:"nowrap",...mono}},d.wq),
                h("td",{style:{padding:"12px 14px",fontWeight:600,color:"rgba(255,210,0,0.6)",whiteSpace:"nowrap",...mono}},d.wp),
                h("td",{style:{padding:"12px 14px",whiteSpace:"nowrap"}},
                  h("span",{style:{background:d.up?"rgba(34,197,94,0.12)":"rgba(239,68,68,0.12)",color:d.up?"#22c55e":"#f87171",padding:"2px 8px",borderRadius:4,fontSize:10,fontWeight:600}},
                    d.up?"↑ Higher better":"↓ Lower better"
                  )
                )
              )),
              h("tr",{style:{background:"#0F1E30",borderTop:"2px solid rgba(255,210,0,0.2)"}},
                h("td",{style:{padding:"12px 14px",fontWeight:700,color:"#FFD200"}},"Total"),
                h("td",null),
                h("td",{style:{padding:"12px 14px",fontWeight:700,color:"#FFD200",...mono}},"100.0%"),
                h("td",{style:{padding:"12px 14px",fontWeight:700,color:"#FFD200",...mono}},"100.0%"),
                h("td",null)
              )
            )
          )
        )
      ),
 
      // MISSING STORES FOOTER
      h("div",{style:{marginTop:28,background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.15)",borderRadius:8,padding:"12px 16px"}},
        h("div",{style:{fontSize:11,fontWeight:600,color:"#f87171",marginBottom:6}},"⚠ Stores not yet in latest sheet tab (19 May)"),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
          ...MISSING.map(s=>h("span",{key:s.id,style:{background:"rgba(239,68,68,0.1)",color:"#f87171",padding:"3px 9px",borderRadius:5,fontSize:11,...mono}},
            label(s.id)+" · "+s.city
          ))
        )
      )
    )
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
